[project]
name = "pkdl-logger"
version = "0.1.0"
description = "Configure and read out a Parkside (Lidl) PKDL A1 climate logger on Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.8",
]

[project.scripts]
pkdl-logger = "pkdl_logger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkdl_logger"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.8",
    "ruff>=0.4",
    "types-pyserial>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fast: quick tests (auto-applied to every test that is not slow)",
    "slow: tests slower than ~2s (e.g. matplotlib rendering)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["pkdl-a1"]  # upstream reverse-engineering clone, not our code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
# matplotlib ships py.typed, but its stubs reject datetime sequences passed to
# Axes.plot (accepted at runtime) and leave some date helpers untyped. Relax only
# this rendering module rather than weakening the strict check everywhere.
module = ["pkdl_logger.plotting"]
disallow_untyped_calls = false
disable_error_code = ["arg-type"]
